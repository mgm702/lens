version: 2

project_name: lens

before:
  hooks:
    - go mod tidy

builds:
  - id: lens
    main: ./cmd/lens
    binary: lens
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: lens
    name_template: "lens_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - examples/**

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

brews:
  - name: lens
    repository:
      owner: mgm702
      name: homebrew-lens
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://github.com/mgm702/lens"
    description: "Domain-agnostic conversational AI evaluation harness"
    license: "MIT"
    test: |
      system "#{bin}/lens", "--version"

release:
  github:
    owner: mgm702
    name: lens
  draft: false
  prerelease: auto
